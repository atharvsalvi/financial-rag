name: Backend checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-ephemeral
          POSTGRES_DB: financialresearch_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d financialresearch_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci-ephemeral@localhost:5432/financialresearch_test?schema=public
      NODE_ENV: test
      PORT: 3000
      REDIS_URL: redis://localhost:6379
      OLLAMA_BASE_URL: http://localhost:11434
      OLLAMA_EMBEDDING_MODEL: test-model
      EMBEDDING_DIMENSIONS: 768
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run migrate:deploy
      - run: npm run test:integration
